org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental caches are keyed to the build directory. A build that is
# killed mid-compile (OOM, Ctrl+C, a closed terminal) leaves them half-written
# and the next build dies with "Could not close incremental caches ... already
# registered". Compiling the plugins from scratch costs a few seconds and makes
# the build repeatable, which matters more than that on a 8 GB machine.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
